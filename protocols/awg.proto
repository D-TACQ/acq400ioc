Terminator = LF;
ExtraInput = Ignore;

getCursor {
	out "playloop_cursor";
	in "%d";
}

getReps {
	out "playloop_repeats";
	in "%d";
}

getActive {
	out "task_active";
	in "%d";
}

getArm {
	out "awg_state_arm";
	in "%d";
}

getML {
	out "playloop_length";
	in "%d %(\$1)d";
}

getMaxlen {
	out "playloop_maxlen";
	in "%d";   
}

getAwgSeg {
	out "awg_seg";
	in "%s";
}
getCompletedShot {
	out "completed_shot";
	in "%d";
}

getMux {
	out "\$1";
	in "%x";
}

getOneShot {
	out "playloop_oneshot";
	in "%d";
}

setOneShot {
	out "playloop_oneshot %d";
	in;
}

setAwgSoftTrigger {
	out "awg SOFT_TRIGGER=%d";
	in;
}

getAwgSoftTrigger {
	out "awg";
	in "SOFT_TRIGGER=%d";
}

setAbort {
    	out "playloop_oneshot %d";
    	in;
    	out "awg_abort %d";
    	in;
}

setAwgRgm {
	out "awg_rtm %d";
	in;
}
getAwgRgm {
	out "awg_rtm";
	in "%d";
}
setBurstLen {
    	out "rtm_translen %d";
    	in;
}

getBurstLen {
	out "rtm_translen";
	in "%d";
}

getPushBuf {
	out "awg_stream_buffers";
	in "awg_stream:%d,%*d,%(LOPR)d,%(HOPR)d";
}
getPullBuf {	
	in "awg_stream:%*d,%d,%(LOPR)d,%(HOPR)d";
}
