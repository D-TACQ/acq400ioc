Terminator = LF;
ExtraInput = Ignore;
ReplyTimeout = 10000;

getCount {
	out "\$1*";
	in "\$1 %d";
}

getTaiDate {
	out "tai_date";
	in "tai_date %#s";
}

getSi5326TP_STATE {
	out "si5326_tune_phase.state";
	in "%#s";
}

getWRSFP {
	out "wrsfp";
	in "%d";
}

getSi5326TP_STATE_VALUE {
	in "%*d %s %*d %*s";
}

getSi5326TP_OK {
	in "%*d %*s %*d %*s %*d %d";
}

getSi5326TP_BUSY {
	in "%*d %*s %*d %*s %d %*d";
}

getSi5326TP_BUSY_STEP {
	in "%d %*s %*d %*s %*d %*d";
}


setSi5326TP {
	out "si5326_tune_phase 1";
	in "";
}

set_wrtd_txi {
	out "wrtd_txi 1";
	in "";
}

set_wrtd_txi_id {
	out "wrtd_txi %s";
	in "";
}

#mac_buf:ac:ac:ac:ac:00:21:54:34:00:58
#setting delays 242482 200482

set_wr_reset {
	out "wr_reset";
	in "mac_buf:ac:ac:ac:ac:%*s";
	in "setting delays %*d %*d";
}

get_wr_mac {
	in "mac_buf:ac:ac:ac:ac:%s";
}

get_wr_delay {
	in "setting delays %d %*d";
}

setBypassTrgDeb {
	out "bypass_trg_debounce %d";
	in "";
}

getBypassTrgDeb {
	out "bypass_trg_debounce";
	in "%d";
}

setSfpTxDisable {
	out "sfp_tx_disable %d";
	in;
}

getSfpTxDisable {
	out "sfp_tx_disable";
	in "%d";
}